publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  album_media:
    path: packages/album_media
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
